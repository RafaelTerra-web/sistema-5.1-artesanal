name: Aplicativo A34
on:
  push:
    paths: ['android-a34/**', '.github/workflows/android-a34.yml']
  pull_request:
    paths: ['android-a34/**', '.github/workflows/android-a34.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Disponibilizar ferramentas Android
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compilar e verificar
        working-directory: android-a34
        run: sh gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
