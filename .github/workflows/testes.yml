name: Testes isolados
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm test
      - run: npm run test:netflix
      - run: node scripts/verificar-publicacao.mjs
      - run: python scripts/tests/test_cm6206_engine.py
      - run: python scripts/test-cm6206-app-routing.py
  relay-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pool e filas sem audio real
        shell: powershell
        run: .\configuracao-pc\testar-relay-pool.ps1
      - name: Estado, volume e painel sem audio real
        shell: powershell
        run: |
          .\scripts\test-cm6206-system-state.ps1
          .\scripts\test-cm6206-controller-locations.ps1
          .\scripts\test-cm6206-remote-volume.ps1
          .\scripts\test-audio-panel-refresh.ps1
          .\scripts\optical-tests\test-continuous-spdif-relay.ps1
          .\scripts\optical-tests\test-ac3-encoder.ps1
