# Recebe a mixagem PCM 5.1 do cabo virtual. Nao faz upmix de 5.1 nativo.
# Codifica uma vez em AC-3; atraso quatro canais 70 ms, CEN/LFE 0 ms.
audio-device=wasapi/{e89cb1c3-e885-4df2-800f-ac950f115f89}
audio-exclusive=yes
audio-fallback-to-null=no
audio-channels=5.1
audio-spdif=
ad-lavc-downmix=no
af=lavfi=[adelay=70|70|0|0|70|70],lavcac3enc=tospdif=yes:bitrate=448:minch=6
volume=100
volume-max=100
speed=1
cache=no
demuxer=rawaudio
demuxer-rawaudio-format=floatle
demuxer-rawaudio-rate=48000
demuxer-rawaudio-channels=5.1
demuxer-readahead-secs=0
demuxer-max-bytes=256KiB




