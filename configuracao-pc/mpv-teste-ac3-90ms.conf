audio-fallback-to-null=no
audio-channels=5.1,5.1(side)
audio-spdif=
ad-lavc-downmix=no
af=lavfi=[aformat=channel_layouts=5.1,adelay=160|160|0|0|160|160],lavcac3enc=tospdif=yes:bitrate=448:minch=6
