# PCM 5.1 no stdin em WAV continuo; pacotes pequenos, nao rawaudio de 125 ms.
# Correcao relativa mantida: FL/FR/SL/SR 70 ms; CEN/LFE 0 ms.
audio-device=wasapi/{e89cb1c3-e885-4df2-800f-ac950f115f89}
audio-exclusive=yes
audio-fallback-to-null=no
audio-channels=5.1
audio-spdif=
ad-lavc-downmix=no
af=lavfi=[asetrate=48002,aresample=48000:filter_size=64:phase_shift=10:cutoff=0.97,adelay=70|70|0|0|70|70],lavcac3enc=tospdif=yes:bitrate=640:minch=6
audio-buffer=0.032
volume=100
volume-max=100
speed=1
cache=no
demuxer=lavf
demuxer-lavf-format=wav
demuxer-lavf-probe-info=no
demuxer-lavf-o=ignore_length=1,max_size=11520
demuxer-lavf-buffersize=4096
stream-buffer-size=8192
demuxer-readahead-secs=0
demuxer-max-bytes=64KiB
input-ipc-server=\\.\pipe\SistemaArtesanalAudio51
terminal=no
osc=no
input-media-keys=no
media-controls=no
input-default-bindings=no
load-scripts=no
