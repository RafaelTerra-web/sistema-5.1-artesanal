# Perfil exclusivo do player: audio 5.1 -> atraso -> Dolby Digital -> HDMI.
audio-device=wasapi/{19067007-77d3-418c-9f48-d547a6bf9962}
audio-exclusive=yes
audio-fallback-to-null=no
audio-channels=stereo
# Decodificar o original e processar antes de recodificar; nao passar direto.
audio-spdif=
ad-lavc-downmix=no
volume=100
volume-max=100
speed=1

[delay-51]
# Ativar somente para os dois layouts 5.1 comuns.
profile-cond=get('audio-params/channels','')=='5.1' or get('audio-params/channels','')=='5.1(side)'
profile-restore=copy
audio-channels=5.1,5.1(side)
# Ordem PCM 5.1: FL, FR, FC, LFE, SL/BL, SR/BR.
af=lavfi=[adelay=70|70|0|0|70|70],lavcac3enc=tospdif=yes:bitrate=448:minch=6
